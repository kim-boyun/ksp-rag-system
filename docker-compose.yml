services:
  # ================================
  # RAG 애플리케이션
  # ================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ksp-rag-app
    env_file:
      - .env  # Makefile에서 .env.local 또는 .env.server를 .env로 복사
    environment:
      - PYTHONDONTWRITEBYTECODE=1  # Python 캐시 비활성화
    volumes:
      - ./:/app  # 전체 프로젝트 마운트 (dev 편의)
      - ./data/model-cache:/root/.cache/huggingface  # 임베딩 모델 캐시 (프로젝트 = 외장 SSD)
    networks:
      - rag-network
    profiles:
      - local
      - server
      - app-only  # 기존 Elastic/외부 vLLM 사용 시 app만 실행
    extra_hosts:
      - "host.docker.internal:host-gateway"  # 호스트 서비스 접근용 (Linux)
    stdin_open: true
    tty: true
    command: tail -f /dev/null  # 개발 중 컨테이너 유지

  # ================================
  # Elasticsearch (서버 모드 전용)
  # ================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: ksp-rag-elastic
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms2g -Xmx2g"
    ports:
      - "9200:9200"
    volumes:
      - ./data/elastic-data:/usr/share/elasticsearch/data  # 프로젝트 내 저장 = 외장 SSD
    networks:
      - rag-network
    profiles:
      - server
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ================================
  # Kibana (선택, Elasticsearch 디버깅용 UI - RAG에는 불필요)
  # ================================
  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    container_name: ksp-rag-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    networks:
      - rag-network
    profiles:
      - kibana
    depends_on:
      - elasticsearch
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ================================
  # Streamlit UI (로컬/서버 공통)
  # ================================
  ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ksp-rag-ui
    env_file:
      - .env  # Makefile에서 .env.local 또는 .env.server를 .env로 복사
    environment:
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./data/model-cache:/root/.cache/huggingface
    ports:
      - "8501:8501"
    networks:
      - rag-network
    profiles:
      - ui
      - app-only  # 기존 Elastic/외부 vLLM 사용 시 ui만 실행
    extra_hosts:
      - "host.docker.internal:host-gateway"  # 호스트 서비스 접근용 (Linux)
    command: streamlit run src/ui/app.py --server.port=8501 --server.address=0.0.0.0

networks:
  rag-network:
    driver: bridge

# 볼륨은 사용하지 않음. data/elastic-data, data/model-cache 로 프로젝트(외장 SSD)에 저장
