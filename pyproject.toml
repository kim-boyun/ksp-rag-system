[tool.poetry]
name = "ragapp"
version = "0.1.0"
description = "Docker-based hybrid RAG system with local/server mode support"
authors = ["KSP Team"]
readme = "README.md"
packages = [{include = "ragapp", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.6.1"
pydantic-settings = "^2.1.0"
python-dotenv = "^1.0.1"
sentence-transformers = "^2.3.1"
transformers = "^4.37.2"
torch = "^2.2.0"
rank-bm25 = "^0.2.2"
faiss-cpu = "^1.7.4"
numpy = "^1.24.0"
scikit-learn = "^1.3.0"
elasticsearch = "^8.12.0"
openai = "^1.12.0"
httpx = "^0.26.0"
langchain = "^0.1.20"
langchain-community = "^0.0.38"
langchain-text-splitters = "^0.0.1"
pypdf = "^4.0.1"
pdfplumber = "^0.11.0"
pymupdf = "^1.24.0"
Pillow = "^10.0.0"
python-docx = "^1.1.0"
typer = "0.9.0"
click = "8.1.7"
rich = "^13.7.0"
streamlit = "^1.31.0"
loguru = "^0.7.2"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.4"
pytest-asyncio = "^0.23.4"
pytest-cov = "^4.1.0"
reportlab = "^4.0.9"

[tool.poetry.scripts]
ragapp = "ragapp.cli:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/test_*.py"]
